onboarding = false
[theme]
name = "catppuccin"

auto_switch = false
[worktrees]
directory = "~/Repos/worktrees"

[keys]
prefix = "ctrl+space"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

new_tab = "prefix+t"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
