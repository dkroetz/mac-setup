name: AI Feature Spec
description: Define a feature request for staged AI-agent delivery.
title: "[AI Feature]: "
labels:
  - ai
  - feature
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for net-new capabilities or meaningful enhancements.
        Fill each section with concrete, testable details so agents can execute Research -> Architect -> Implement with minimal follow-up.

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: Choose how this work should be executed.
      options:
        - orchestrator auto
        - manual slash commands
        - isolated *-task
    validations:
      required: true

  - type: textarea
    id: problem_outcome
    attributes:
      label: Problem and desired outcome
      description: State the current pain and the business or user outcome to achieve.
      placeholder: |
        Problem:
        Desired outcome:
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: List what this feature must include.
      placeholder: |
        - Capability A
        - API change B
        - Test coverage C
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List explicit non-goals to protect implementation boundaries.
      placeholder: |
        - No migration of legacy endpoint X
        - No UI redesign
    validations:
      required: true

  - type: textarea
    id: context_references
    attributes:
      label: Context and references
      description: Link relevant code paths, docs, PRs, and external references.
      placeholder: |
        - src/module/file.py:123
        - https://example.com/spec
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Provide hard limits such as compatibility, performance, security, and deadlines.
      placeholder: |
        - Keep public API backward compatible
        - p95 latency must stay under 200ms
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Measurable acceptance criteria
      description: Define pass/fail conditions with concrete metrics or observable behavior.
      placeholder: |
        - [ ] Endpoint returns field `foo` for valid requests
        - [ ] Existing integration tests remain green
        - [ ] New tests cover success and failure paths
    validations:
      required: true

  - type: textarea
    id: verification_commands
    attributes:
      label: Verification commands
      description: Provide exact commands agents should run to verify completion.
      render: bash
      placeholder: |
        make lint
        make test
        make typecheck
    validations:
      required: true

  - type: textarea
    id: expected_deliverables
    attributes:
      label: Expected deliverables and artifacts
      description: List outputs expected from each stage.
      placeholder: |
        - Research artifact in .opencode/research/
        - Plan artifact in .opencode/plans/
        - Code changes, tests, and notes in PR description
    validations:
      required: true
